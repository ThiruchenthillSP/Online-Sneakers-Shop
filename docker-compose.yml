name: online-sneakers-shop
services:
  shop:
    build: .
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8091}:8091"
    environment:
      PORT: "8091"
      DB_PATH: /app/data/sneaker-shop.db
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sneaker-shop.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    volumes:
      - shop-data:/app/data
volumes:
  shop-data:
